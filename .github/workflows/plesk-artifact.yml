name: Plesk-Artefakt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux-Artefakt erstellen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: pnpm aktivieren
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Projekt prüfen
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:plesk
          pnpm db:check

      - name: Chromium installieren
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E-Tests ausführen
        run: pnpm test:e2e

      - name: Plesk-Artefakt erstellen und prüfen
        run: |
          pnpm build:plesk
          pnpm verify:plesk
          archive_path="$GITHUB_WORKSPACE/dist/fahrseiten-plesk-${GITHUB_SHA::12}.tar.gz"
          tar -C dist/plesk -czf "$archive_path" .
          test -s "$archive_path"

      - name: Plesk-Artefakt bereitstellen
        uses: actions/upload-artifact@v6
        with:
          name: fahrseiten-plesk-${{ github.sha }}
          path: dist/fahrseiten-plesk-*.tar.gz
          if-no-files-found: error
          retention-days: 14
